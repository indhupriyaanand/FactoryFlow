{% extends "base.html" %}
{% block title %}Payment - FactoryFlow{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Record payment for {{ invoice.invoice_number }}</h1>
<p>Outstanding balance: <strong>₹{{ invoice.outstanding_amount }}</strong></p>
<form method="post" class="card card-body">
    {% csrf_token %}{{ form.non_field_errors }}{{ form.as_p }}
    <button class="btn btn-primary w-100 w-md-auto">Record payment</button>
</form>
{% endblock %}
