{% extends "base.html" %}
{% block title %}{{ model_name }} - FactoryFlow{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ model_name }}</h1>
<form method="post" class="card card-body">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="d-flex gap-2">
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-outline-secondary" href="{% url 'masters:list' resource=resource %}">Cancel</a>
  </div>
</form>
{% endblock %}
